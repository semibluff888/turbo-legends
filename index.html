<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Turbo Legends</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏎️</text></svg>" />
  <link rel="stylesheet" href="./src/styles.css?v=20260802-mobile-lobby-header-fix" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <!-- Menu screens (DOM overlays) -->
    <section id="screen-title" class="screen" hidden></section>
    <section id="screen-character" class="screen" hidden></section>
    <section id="screen-track" class="screen" hidden></section>
    <section id="screen-difficulty" class="screen" hidden></section>
    <section id="screen-settings" class="screen overlay" hidden></section>
    <section id="screen-help" class="screen overlay" hidden></section>
    <section id="screen-pause" class="screen overlay" hidden></section>
    <section id="screen-results" class="screen overlay" hidden></section>

    <!-- Online flow (owned by src/ui/online-screens.js) -->
    <section id="screen-online-lobby" class="screen online-screen" hidden></section>
    <section id="screen-online-room" class="screen online-screen" hidden></section>
    <section id="screen-online-results" class="screen online-screen overlay" hidden></section>

    <!-- Shared title / race network telemetry -->
    <div id="network-status-overlay" hidden></div>

    <!-- In-race HUD -->
    <div id="hud" hidden>
      <canvas id="minimap" width="220" height="220"></canvas>
    </div>

    <!-- Presentation-only finish camera treatment. -->
    <div id="finish-cinematic" aria-hidden="true"></div>
    <button id="finish-cinematic-skip" type="button" aria-label="Skip finish cinematic" hidden disabled>
      <span class="finish-skip-desktop">ENTER / A&nbsp;&nbsp;·&nbsp;&nbsp;SKIP</span>
      <span class="finish-skip-touch">SKIP</span>
    </button>

    <!-- Mobile race controls: auto-accelerate, drag left to steer. -->
    <div id="touch-steer-zone" aria-label="Drag left or right to steer">
      <div class="touch-steer-pad" aria-hidden="true">
        <span class="touch-steer-arrow touch-steer-arrow-left">‹</span>
        <span class="touch-steer-rail"><span class="touch-steer-knob"></span></span>
        <span class="touch-steer-arrow touch-steer-arrow-right">›</span>
        <span class="touch-steer-label">STEER</span>
      </div>
    </div>
    <div id="touch-controls" aria-label="Race controls">
      <button class="btn btn-pause" type="button" aria-label="Pause race">
        <span class="touch-pause-icon" aria-hidden="true"></span>
      </button>
      <div class="touch-action-cluster">
        <button class="btn btn-item" type="button" aria-label="Use item">
          <span class="touch-action-icon touch-item-icon" aria-hidden="true">?</span>
          <span class="touch-action-label">ITEM</span>
        </button>
        <button class="btn btn-brake" type="button" aria-label="Brake or reverse">
          <span class="touch-action-icon" aria-hidden="true">▼</span>
          <span class="touch-action-label">BRAKE</span>
        </button>
        <button class="btn btn-drift" type="button" aria-label="Drift">
          <span class="touch-action-icon touch-drift-icon" aria-hidden="true">↻</span>
          <span class="touch-action-label">DRIFT</span>
        </button>
      </div>
    </div>

    <noscript>
      <div class="noscript-warning">Turbo Legends needs JavaScript enabled.</div>
    </noscript>
  </div>
  <script type="module" src="./src/main.js?v=20260802-main-menu-center"></script>
</body>
</html>
