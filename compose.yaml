services:
  turbo-legends:
    build:
      context: .
    image: turbo-legends:local
    container_name: turbo-legends
    restart: unless-stopped
    init: true
    ports:
      - "8888:5173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      USER_DB_PATH: /data/users.sqlite
      USER_SESSION_CLEANUP_INTERVAL_MS: 600000
      GUEST_CREATION_LIMIT: 0
      GUEST_CREATION_WINDOW_MS: 600000
      LEADERBOARD_CACHE_TTL_MS: 60000
      ADMIN_KEY: "${ADMIN_KEY:-}"
      METRICS_TOKEN: ""
      METRICS_LOG_INTERVAL_MS: 60000
      TRUST_PROXY: "false"
      AUTH_SCRYPT_CONCURRENCY: 2
      AUTH_SCRYPT_QUEUE_LIMIT: 32
      LOBBY_BROADCAST_DEBOUNCE_MS: 100
      MAINTENANCE_INTERVAL_MS: 500
      STATIC_COMPRESSION_CACHE_BYTES: 16777216
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - turbo-legends-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 15s

volumes:
  turbo-legends-data:
